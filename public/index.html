<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div>
        <p class="eyebrow">LIBRARY ADMIN</p>
        <h1>Book Management</h1>
        <p class="subtitle">Add, view, update and remove books.</p>
      </div>
      <div class="book-count" aria-live="polite">
        <span id="bookCount">0</span>
        <small>Books</small>
      </div>
    </header>

    <section class="panel">
      <h2 id="formHeading">Add a book</h2>
      <form id="bookForm">
        <input type="hidden" id="bookId">
        <div class="form-grid">
          <label>
            Book title
            <input id="title" type="text" placeholder="Enter book title" required maxlength="120">
          </label>
          <label>
            Author
            <input id="author" type="text" placeholder="Enter author name" required maxlength="100">
          </label>
          <label>
            Price (₹)
            <input id="price" type="number" placeholder="Enter price" min="0" step="0.01" required>
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" id="submitButton">Add Book</button>
          <button type="button" id="cancelButton" class="secondary hidden">Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <div class="list-heading">
        <div>
          <h2>Available books</h2>
          <p class="subtitle">Your current book collection</p>
        </div>
        <button type="button" id="refreshButton" class="secondary">Refresh</button>
      </div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Author</th>
              <th>Price</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="booksTableBody">
            <tr><td colspan="5" class="empty">Loading books...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
